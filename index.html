<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Org Hierarchy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8edf5;
  --card:#ffffff;
  --border:#dde3ee;
  --text-dark:#111827;
  --text-mid:#4b5563;
  --text-light:#9ca3af;

  /* GM palette */
  --gm-idle:#1e3a5f;
  --gm-active:#2563eb;
  --gm-glow:rgba(37,99,235,.35);

  /* RM palette */
  --rm-idle:#fff;
  --rm-active:#2563eb;
  --rm-glow:rgba(37,99,235,.25);

  /* OM palette */
  --om-idle:#fff;
  --om-active:#059669;
  --om-glow:rgba(5,150,105,.25);

  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:10px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.07);
  --shadow-md:0 8px 24px rgba(0,0,0,.12);
  --shadow-lift:0 16px 40px rgba(0,0,0,.18);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;padding:28px 20px 80px;overflow-x:hidden}

/* ── Page header ── */
.page-header{text-align:center;margin-bottom:28px}
.page-header h1{font-size:22px;font-weight:800;color:var(--text-dark);letter-spacing:-.4px}
.page-header p{font-size:13px;color:var(--text-light);margin-top:5px}

/* ── Search ── */
.search-wrap{max-width:480px;margin:0 auto 22px;position:relative}
.search-wrap input{
  width:100%;padding:12px 42px 12px 16px;
  border:2px solid var(--border);border-radius:10px;
  font-size:14px;font-family:'Inter',sans-serif;
  background:#fff;color:var(--text-dark);outline:none;
  transition:border .2s,box-shadow .2s
}
.search-wrap input:focus{border-color:var(--gm-active);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.search-wrap .clr{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-light);font-size:18px}
#result-count{text-align:center;font-size:12px;color:var(--text-light);margin-bottom:10px;min-height:16px}

/* ── Search results ── */
#search-results{max-width:640px;margin:0 auto 20px;display:none;flex-direction:column;gap:5px}
.sr-item{background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;border:1.5px solid var(--border);display:flex;align-items:center;gap:12px;transition:border .15s,box-shadow .15s,transform .15s}
.sr-item:hover{border-color:var(--gm-active);box-shadow:0 4px 14px rgba(37,99,235,.12);transform:translateY(-1px)}
.sr-item.exact{border-color:var(--gm-active);background:#eff6ff}
.sr-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:#fff}
.sr-avatar.gm{background:var(--gm-idle)}
.sr-avatar.rm{background:var(--gm-active)}
.sr-avatar.om{background:var(--om-active)}
.sr-avatar.sf{background:#64748b}
.sr-info{flex:1;min-width:0}
.sr-name{font-size:13px;font-weight:600;color:var(--text-dark)}
.sr-name mark{background:#fef08a;color:#78350f;border-radius:3px;padding:0 2px}
.sr-sub{font-size:11px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0}
.sr-badge.gm{background:var(--gm-idle);color:#fff}
.sr-badge.rm{background:#dbeafe;color:var(--gm-active)}
.sr-badge.om{background:#d1fae5;color:var(--om-active)}
.sr-badge.sf{background:#f1f5f9;color:#64748b}

/* ══════════════════════════════════════════
   GM CARDS — top row
══════════════════════════════════════════ */
.gm-row{
  display:flex;gap:20px;justify-content:center;flex-wrap:wrap;
  max-width:960px;margin:0 auto 8px;
}

.gm-card{
  background:var(--gm-idle);
  color:#fff;
  border-radius:var(--radius-lg);
  padding:20px 22px 18px;
  min-width:240px;flex:1;max-width:300px;
  cursor:pointer;user-select:none;
  box-shadow:var(--shadow-md);
  position:relative;overflow:hidden;
  /* transition for everything EXCEPT transform (handled by JS) */
  transition:box-shadow .3s,background .3s,transform .35s cubic-bezier(.34,1.56,.64,1);
  will-change:transform;
  z-index:1;
}

/* Shimmer layer */
.gm-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);
  transform:translateX(-100%);
  transition:transform .6s ease;
  pointer-events:none;
}
.gm-card:hover::before{transform:translateX(100%)}

.gm-card:hover{
  box-shadow:var(--shadow-lift);
  transform:translateY(-4px) scale(1.02);
}

.gm-card.active{
  background:var(--gm-active);
  box-shadow:0 0 0 3px #93c5fd, var(--shadow-lift), 0 0 40px var(--gm-glow);
  transform:translateY(-8px) scale(1.04);
  z-index:10;
}

.gm-avatar{
  width:50px;height:50px;border-radius:50%;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;margin-bottom:12px;
  transition:background .3s,transform .3s;
}
.gm-card.active .gm-avatar{background:rgba(255,255,255,.28);transform:scale(1.1)}

.gm-name{font-size:14px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.gm-role{font-size:11px;opacity:.65;margin-top:3px;font-weight:500}
.gm-stats{font-size:12px;opacity:.75;margin-top:10px;display:flex;gap:10px}
.stat-pill{background:rgba(255,255,255,.15);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;transition:background .3s}
.gm-card.active .stat-pill{background:rgba(255,255,255,.22)}
.gm-phone{margin-top:8px}
.gm-phone a{font-size:11px;color:rgba(255,255,255,.75);text-decoration:none;transition:color .2s}
.gm-phone a:hover{color:#fff}
.gm-chevron{
  position:absolute;right:14px;top:14px;
  width:24px;height:24px;border-radius:50%;
  background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .3s;
}
.gm-card.active .gm-chevron{transform:rotate(90deg);background:rgba(255,255,255,.28)}

/* active indicator bar */
.gm-card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:rgba(255,255,255,.4);
  transform:scaleX(0);transform-origin:left;
  transition:transform .4s ease .1s;
}
.gm-card.active::after{transform:scaleX(1)}

/* ══════════════════════════════════════════
   EXPANDED GM AREA
══════════════════════════════════════════ */
.gm-expanded{
  max-width:960px;margin:0 auto 24px;
  overflow:hidden;
  max-height:0;
  opacity:0;
  transform:translateY(-12px);
  transition:max-height .45s cubic-bezier(.4,0,.2,1),opacity .3s ease,transform .35s ease;
}
.gm-expanded.open{
  max-height:6000px;
  opacity:1;
  transform:translateY(0);
}

/* ══════════════════════════════════════════
   RM CARDS
══════════════════════════════════════════ */
.rm-row{display:flex;gap:14px;flex-wrap:wrap;padding:16px 0 4px}

.rm-card{
  background:#fff;
  border:2px solid var(--border);
  border-radius:var(--radius-md);
  padding:14px 16px;
  min-width:190px;flex:1;max-width:235px;
  cursor:pointer;user-select:none;
  box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
  transition:border .25s,box-shadow .25s,background .25s,transform .35s cubic-bezier(.34,1.56,.64,1);
  will-change:transform;
}
.rm-card:hover{
  border-color:#93c5fd;
  box-shadow:var(--shadow-md);
  transform:translateY(-3px) scale(1.02);
}
.rm-card.active{
  border-color:var(--rm-active);
  background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 100%);
  box-shadow:0 0 0 3px #bfdbfe, var(--shadow-md), 0 0 28px var(--rm-glow);
  transform:translateY(-5px) scale(1.03);
  color:#fff;
}
.rm-avatar{
  width:38px;height:38px;border-radius:50%;
  background:#dbeafe;color:var(--gm-active);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;margin-bottom:8px;
  transition:background .25s,color .25s,transform .3s;
}
.rm-card.active .rm-avatar{background:rgba(255,255,255,.25);color:#fff;transform:scale(1.1)}
.rm-name{font-size:13px;font-weight:600;color:var(--text-dark);transition:color .25s}
.rm-card.active .rm-name{color:#fff}
.rm-role{font-size:10.5px;color:var(--text-light);margin-top:2px;transition:color .25s}
.rm-card.active .rm-role{color:rgba(255,255,255,.7)}
.rm-stats{font-size:11px;color:var(--text-light);margin-top:6px;display:flex;gap:8px;transition:color .25s}
.rm-card.active .rm-stats{color:rgba(255,255,255,.75)}
.rm-spill{background:#f1f5f9;border-radius:20px;padding:2px 8px;font-size:10.5px;font-weight:600;transition:background .25s,color .25s}
.rm-card.active .rm-spill{background:rgba(255,255,255,.2);color:#fff}
.rm-phone a{font-size:10.5px;color:var(--gm-active);text-decoration:none;transition:color .25s}
.rm-card.active .rm-phone a{color:rgba(255,255,255,.8)}
.rm-chevron{
  position:absolute;right:12px;top:12px;
  width:22px;height:22px;border-radius:50%;
  background:#f1f5f9;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s;
  color:var(--text-light);
}
.rm-card.active .rm-chevron{transform:rotate(90deg);background:rgba(255,255,255,.25);color:#fff}

/* ══════════════════════════════════════════
   OM AREA + CARDS
══════════════════════════════════════════ */
.om-area{
  overflow:hidden;
  max-height:0;opacity:0;transform:translateY(-8px);
  transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .28s ease,transform .3s ease;
  margin-left:20px;border-left:3px solid #bfdbfe;padding-left:16px;margin-top:2px;
}
.om-area.open{max-height:4000px;opacity:1;transform:translateY(0)}

.om-row{display:flex;gap:11px;flex-wrap:wrap;padding:14px 0 4px}

.om-card{
  background:#fff;
  border:2px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  min-width:170px;flex:1;max-width:210px;
  cursor:pointer;user-select:none;
  box-shadow:var(--shadow-sm);
  position:relative;
  transition:border .25s,box-shadow .25s,background .25s,transform .35s cubic-bezier(.34,1.56,.64,1);
  will-change:transform;
}
.om-card:hover{
  border-color:#6ee7b7;
  box-shadow:var(--shadow-md);
  transform:translateY(-3px) scale(1.025);
}
.om-card.active{
  border-color:var(--om-active);
  background:linear-gradient(135deg,#047857 0%,#059669 100%);
  box-shadow:0 0 0 3px #a7f3d0, var(--shadow-md), 0 0 24px var(--om-glow);
  transform:translateY(-4px) scale(1.03);
  color:#fff;
}
.om-avatar{
  width:32px;height:32px;border-radius:50%;
  background:#d1fae5;color:var(--om-active);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;margin-bottom:6px;
  transition:background .25s,color .25s,transform .3s;
}
.om-card.active .om-avatar{background:rgba(255,255,255,.25);color:#fff;transform:scale(1.1)}
.om-name{font-size:12px;font-weight:600;color:var(--text-dark);transition:color .25s}
.om-card.active .om-name{color:#fff}
.om-role{font-size:10px;color:var(--text-light);margin-top:1px;transition:color .25s}
.om-card.active .om-role{color:rgba(255,255,255,.7)}
.om-stats{font-size:10.5px;color:var(--text-light);margin-top:5px;transition:color .25s}
.om-card.active .om-stats{color:rgba(255,255,255,.75)}
.om-phone a{font-size:10px;color:var(--om-active);text-decoration:none;transition:color .25s}
.om-card.active .om-phone a{color:rgba(255,255,255,.8)}
.om-chevron{
  position:absolute;right:10px;top:10px;
  width:20px;height:20px;border-radius:50%;
  background:#f1f5f9;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--text-light);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s;
}
.om-card.active .om-chevron{transform:rotate(90deg);background:rgba(255,255,255,.25);color:#fff}

/* ══════════════════════════════════════════
   SF AREA
══════════════════════════════════════════ */
.sf-area{
  overflow:hidden;
  max-height:0;opacity:0;transform:translateY(-6px);
  transition:max-height .38s cubic-bezier(.4,0,.2,1),opacity .25s ease,transform .28s ease;
  margin-left:16px;border-left:3px solid #a7f3d0;padding-left:14px;margin-top:2px;
}
.sf-area.open{max-height:3000px;opacity:1;transform:translateY(0)}

.sf-grid{display:flex;flex-wrap:wrap;gap:7px;padding:12px 0 8px}
.sf-chip{
  background:#f8fafc;border:1.5px solid #e2e8f0;
  border-radius:20px;padding:5px 12px;
  font-size:11.5px;color:var(--text-mid);
  display:flex;align-items:center;gap:5px;
  transition:background .2s,border .2s,transform .2s;
}
.sf-chip:hover{background:#eff6ff;border-color:#93c5fd;transform:scale(1.04)}
.sf-chip.highlight{background:#fef08a;border-color:#ca8a04;font-weight:600;color:#78350f;transform:scale(1.06)}
.sf-loc{color:var(--text-light);font-size:10px}

/* stagger SF chips on open */
.sf-area.open .sf-chip{animation:chipPop .25s ease both}
@keyframes chipPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

/* header-match glow */
.header-match{outline:3px solid #fbbf24 !important;outline-offset:2px}
</style>
</head>

function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function abbr(n){return(n||'').split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()}
function ph(m){return m?`<a href="tel:${m}" onclick="event.stopPropagation()">${m}</a>`:''}

const IDX=[];
DATA.forEach((gm,gi)=>{
  IDX.push({type:'gm',name:gm.name,nl:gm.name.toLowerCase(),mobile:gm.mobile||'',path:'',gi,ri:-1,oi:-1});
  gm.rms.forEach((rm,ri)=>{
    IDX.push({type:'rm',name:rm.name,nl:rm.name.toLowerCase(),mobile:rm.mobile||'',path:gm.name,gi,ri,oi:-1});
    rm.oms.forEach((om,oi)=>{
      IDX.push({type:'om',name:om.name,nl:om.name.toLowerCase(),mobile:om.mobile||'',path:gm.name+' › '+rm.name,gi,ri,oi});
      om.sfs.forEach(sf=>{
        IDX.push({type:'sf',name:sf.name,nl:sf.name.toLowerCase(),
          city:(sf.city||'').toLowerCase(),state:(sf.state||'').toLowerCase(),
          cityR:sf.city||'',stateR:sf.state||'',
          path:gm.name+' › '+rm.name+' › '+om.name,gi,ri,oi});
      });
    });
  });
});

function sc(item,q){
  const n=item.nl,nc=n.replace(/\s+/g,''),qc=q.replace(/\s+/g,'');
  if(n===q||nc===qc)return 100;
  if(n.startsWith(q)||nc.startsWith(qc))return 90;
  if(n.split(' ').some(w=>w.startsWith(q)))return 82;
  if(n.includes(q)||nc.includes(qc))return 70;
  if((item.city||'').includes(q))return 60;
  if((item.state||'').includes(q))return 50;
  return 0;
}
function hl(text,q){
  if(!q)return esc(text);
  const re=new RegExp('('+q.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&').split('').join('\\s*')+')','gi');
  return esc(text).replace(re,'<mark>$1</mark>');
}

/* ── Build DOM ── */
function build(){
  const app=document.getElementById('app');
  const gmRow=document.createElement('div');
  gmRow.className='gm-row';

  DATA.forEach((gm,gi)=>{
    const totalOMs=gm.rms.reduce((s,r)=>s+r.oms.length,0);
    const totalSFs=gm.rms.reduce((s,r)=>s+r.oms.reduce((ss,o)=>ss+o.sfs.length,0),0);

    // GM card
    const card=document.createElement('div');
    card.className='gm-card';card.id='gm-c'+gi;
    card.innerHTML=`
      <div class="gm-chevron">›</div>
      <div class="gm-avatar">${esc(abbr(gm.name))}</div>
      <div class="gm-name">${esc(gm.name)}</div>
      <div class="gm-role">General Manager</div>
      <div class="gm-stats">
        <span class="stat-pill">${gm.rms.length} RMs</span>
        <span class="stat-pill">${totalOMs} OMs</span>
        <span class="stat-pill">${totalSFs} SFs</span>
      </div>
      ${gm.mobile?`<div class="gm-phone">📞 ${ph(gm.mobile)}</div>`:''}
    `;
    card.addEventListener('click',()=>toggleGM(gi));
    gmRow.appendChild(card);

    // Expanded area
    const exp=document.createElement('div');
    exp.className='gm-expanded';exp.id='gm-e'+gi;

    const rmRow=document.createElement('div');
    rmRow.className='rm-row';

    gm.rms.forEach((rm,ri)=>{
      const sfCount=rm.oms.reduce((s,o)=>s+o.sfs.length,0);
      const rmCol=document.createElement('div');
      rmCol.style.cssText='flex:1;min-width:190px;max-width:235px';

      const rcard=document.createElement('div');
      rcard.className='rm-card';rcard.id=`rm-c${gi}-${ri}`;
      rcard.innerHTML=`
        <div class="rm-chevron">›</div>
        <div class="rm-avatar">${esc(abbr(rm.name))}</div>
        <div class="rm-name">${esc(rm.name)}</div>
        <div class="rm-role">Regional Manager</div>
        <div class="rm-stats">
          <span class="rm-spill">${rm.oms.length} OMs</span>
          <span class="rm-spill">${sfCount} SFs</span>
        </div>
        ${rm.mobile?`<div class="rm-phone">📞 ${ph(rm.mobile)}</div>`:''}
      `;
      rcard.addEventListener('click',()=>toggleRM(gi,ri));
      rmCol.appendChild(rcard);
      rmRow.appendChild(rmCol);
    });

    exp.appendChild(rmRow);

    // OM areas (one per RM, full-width below RM row)
    gm.rms.forEach((rm,ri)=>{
      const omArea=document.createElement('div');
      omArea.className='om-area';omArea.id=`om-a${gi}-${ri}`;

      const omRow=document.createElement('div');
      omRow.className='om-row';

      rm.oms.forEach((om,oi)=>{
        const omCol=document.createElement('div');
        omCol.style.cssText='flex:1;min-width:170px;max-width:210px';

        const ocard=document.createElement('div');
        ocard.className='om-card';ocard.id=`om-c${gi}-${ri}-${oi}`;
        ocard.innerHTML=`
          <div class="om-chevron">›</div>
          <div class="om-avatar">${esc(abbr(om.name))}</div>
          <div class="om-name">${esc(om.name)}</div>
          <div class="om-role">Operations Manager</div>
          <div class="om-stats">${om.sfs.length} SFs</div>
          ${om.mobile?`<div class="om-phone">📞 ${ph(om.mobile)}</div>`:''}
        `;
        ocard.addEventListener('click',()=>toggleOM(gi,ri,oi));
        omCol.appendChild(ocard);
        omRow.appendChild(omCol);
      });

      omArea.appendChild(omRow);

      // SF areas
      rm.oms.forEach((om,oi)=>{
        const sfArea=document.createElement('div');
        sfArea.className='sf-area';sfArea.id=`sf-a${gi}-${ri}-${oi}`;
        const grid=document.createElement('div');
        grid.className='sf-grid';
        om.sfs.forEach((sf,si)=>{
          const chip=document.createElement('div');
          chip.className='sf-chip';
          chip.dataset.nl=sf.name.toLowerCase();
          chip.style.animationDelay=(si*18)+'ms';
          chip.innerHTML=`🏪 <span>${esc(sf.name)}</span><span class="sf-loc">${esc(sf.city)}${sf.city&&sf.state?', ':''}${esc(sf.state)}</span>`;
          grid.appendChild(chip);
        });
        sfArea.appendChild(grid);
        omArea.appendChild(sfArea);
      });

      exp.appendChild(omArea);
    });

    app.appendChild(exp);
  });

  app.insertBefore(gmRow,app.firstChild);
}

/* ── Toggles ── */
function toggleGM(gi){
  const exp=document.getElementById('gm-e'+gi);
  const card=document.getElementById('gm-c'+gi);
  const isOpen=exp.classList.contains('open');
  document.querySelectorAll('.gm-expanded').forEach(e=>e.classList.remove('open'));
  document.querySelectorAll('.gm-card').forEach(c=>c.classList.remove('active'));
  // Also close RMs/OMs underneath
  document.querySelectorAll('.om-area,.sf-area').forEach(e=>e.classList.remove('open'));
  document.querySelectorAll('.rm-card,.om-card').forEach(c=>c.classList.remove('active'));
  if(!isOpen){exp.classList.add('open');card.classList.add('active');}
}

function toggleRM(gi,ri){
  event.stopPropagation();
  const area=document.getElementById(`om-a${gi}-${ri}`);
  const card=document.getElementById(`rm-c${gi}-${ri}`);
  const isOpen=area.classList.contains('open');
  // Close all OM areas + SF areas under this GM, deactivate all RM cards under this GM
  DATA[gi].rms.forEach((_,i)=>{
    const a=document.getElementById(`om-a${gi}-${i}`);
    const c=document.getElementById(`rm-c${gi}-${i}`);
    if(a)a.classList.remove('open');
    if(c)c.classList.remove('active');
    DATA[gi].rms[i].oms.forEach((_2,j)=>{
      const sa=document.getElementById(`sf-a${gi}-${i}-${j}`);
      const oc=document.getElementById(`om-c${gi}-${i}-${j}`);
      if(sa)sa.classList.remove('open');
      if(oc)oc.classList.remove('active');
    });
  });
  if(!isOpen){area.classList.add('open');card.classList.add('active');}
}

function toggleOM(gi,ri,oi){
  event.stopPropagation();
  const area=document.getElementById(`sf-a${gi}-${ri}-${oi}`);
  const card=document.getElementById(`om-c${gi}-${ri}-${oi}`);
  const isOpen=area.classList.contains('open');
  DATA[gi].rms[ri].oms.forEach((_,i)=>{
    const a=document.getElementById(`sf-a${gi}-${ri}-${i}`);
    const c=document.getElementById(`om-c${gi}-${ri}-${i}`);
    if(a)a.classList.remove('open');
    if(c)c.classList.remove('active');
  });
  if(!isOpen){area.classList.add('open');card.classList.add('active');}
}

/* ── Search ── */
function doSearch(raw){
  const q=raw.trim().toLowerCase();
  const panel=document.getElementById('search-results');
  const countEl=document.getElementById('result-count');
  if(!q){panel.style.display='none';panel.innerHTML='';countEl.textContent='';clearHL();return;}
  const matches=[];
  IDX.forEach(item=>{const s=sc(item,q);if(s>0)matches.push({...item,_s:s});});
  matches.sort((a,b)=>b._s-a._s||a.name.localeCompare(b.name));
  const seen=new Set();
  const deduped=matches.filter(m=>{const k=m.type+':'+m.name;if(seen.has(k))return false;seen.add(k);return true;});
  const top=deduped.slice(0,20);
  countEl.textContent=deduped.length?`${deduped.length} result${deduped.length>1?'s':''} found`:'No results.';
  if(!top.length){panel.style.display='none';clearHL();return;}
  panel.innerHTML='';panel.style.display='flex';
  top.forEach(item=>{
    const div=document.createElement('div');
    div.className='sr-item'+(item._s>=90?' exact':'');
    const loc=item.type==='sf'?`📍 ${esc(item.cityR)}${item.cityR&&item.stateR?', ':''}${esc(item.stateR)}`:'';
    const mob=item.mobile?`📞 ${esc(item.mobile)}`:'';
    div.innerHTML=`
      <div class="sr-avatar ${item.type}">${esc(abbr(item.name))}</div>
      <div class="sr-info">
        <div class="sr-name">${hl(item.name,q)}</div>
        <div class="sr-sub">${[item.path,loc,mob].filter(Boolean).join(' · ')}</div>
      </div>
      <span class="sr-badge ${item.type}">${item.type.toUpperCase()}</span>
    `;
    div.addEventListener('click',()=>reveal(item));
    panel.appendChild(div);
  });
  if(deduped.length>20){
    const m=document.createElement('div');
    m.style.cssText='text-align:center;font-size:12px;color:#9ca3af;padding:6px';
    m.textContent=`…and ${deduped.length-20} more — type more to narrow down`;
    panel.appendChild(m);
  }
}

function reveal(item){
  clearHL();
  // Open GM
  document.querySelectorAll('.gm-expanded').forEach(e=>e.classList.remove('open'));
  document.querySelectorAll('.gm-card').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.om-area,.sf-area').forEach(e=>e.classList.remove('open'));
  document.querySelectorAll('.rm-card,.om-card').forEach(c=>c.classList.remove('active'));
  const ge=document.getElementById('gm-e'+item.gi);
  const gc=document.getElementById('gm-c'+item.gi);
  ge.classList.add('open');gc.classList.add('active');
  if(item.type==='gm'){gc.classList.add('header-match');setTimeout(()=>gc.scrollIntoView({behavior:'smooth',block:'center'}),80);return;}
  // Open RM
  const ra=document.getElementById(`om-a${item.gi}-${item.ri}`);
  const rc=document.getElementById(`rm-c${item.gi}-${item.ri}`);
  if(ra){ra.classList.add('open');rc.classList.add('active');}
  if(item.type==='rm'){rc.classList.add('header-match');setTimeout(()=>rc.scrollIntoView({behavior:'smooth',block:'center'}),120);return;}
  // Open OM
  const sa=document.getElementById(`sf-a${item.gi}-${item.ri}-${item.oi}`);
  const oc=document.getElementById(`om-c${item.gi}-${item.ri}-${item.oi}`);
  if(sa){sa.classList.add('open');oc.classList.add('active');}
  if(item.type==='om'){oc.classList.add('header-match');setTimeout(()=>oc.scrollIntoView({behavior:'smooth',block:'center'}),150);return;}
  // Highlight SF
  if(sa){
    sa.querySelectorAll('.sf-chip').forEach(chip=>{if(chip.dataset.nl===item.nl)chip.classList.add('highlight');});
    const first=sa.querySelector('.sf-chip.highlight');
    if(first)setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'center'}),200);
  }
}

function clearHL(){
  document.querySelectorAll('.sf-chip.highlight').forEach(c=>c.classList.remove('highlight'));
  document.querySelectorAll('.header-match').forEach(h=>h.classList.remove('header-match'));
}
function clearSearch(){document.getElementById('search').value='';doSearch('');}

build();
</script>
