<style>
:root{
  --bg:#e8edf5;
  --card:#ffffff;
  --border:#dde3ee;
  --text-dark:#111827;
  --text-mid:#4b5563;
  --text-light:#9ca3af;

  /* GM palette */
  --gm-idle:#1e3a5f;
  --gm-active:#2563eb;
  --gm-glow:rgba(37,99,235,.35);

  /* RM palette */
  --rm-idle:#fff;
  --rm-active:#2563eb;
  --rm-glow:rgba(37,99,235,.25);

  /* OM palette */
  --om-idle:#fff;
  --om-active:#059669;
  --om-glow:rgba(5,150,105,.25);

  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:10px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.07);
  --shadow-md:0 8px 24px rgba(0,0,0,.12);
  --shadow-lift:0 16px 40px rgba(0,0,0,.18);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;padding:28px 20px 80px;overflow-x:hidden}

/* ── Page header ── */
.page-header{text-align:center;margin-bottom:32px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.page-header h1{font-size:28px;font-weight:800;color:var(--text-dark);letter-spacing:-.5px;margin-bottom:8px}
.page-header p{font-size:13px;color:var(--text-mid);margin-top:4px;font-weight:500}


/* ── Search ── */
.search-wrap{max-width:520px;margin:0 auto 18px;position:relative}
.search-wrap input{
  width:100%;padding:14px 44px 14px 18px;
  border:2px solid var(--border);border-radius:12px;
  font-size:14px;font-family:'Inter',sans-serif;
  background:#fff;color:var(--text-dark);outline:none;
  transition:border .2s,box-shadow .2s,background .2s;
  box-shadow:0 2px 6px rgba(0,0,0,.04);
}
.search-wrap input::placeholder{color:var(--text-light);font-weight:400}
.search-wrap input:focus{border-color:var(--gm-active);box-shadow:0 0 0 4px rgba(37,99,235,.15),0 4px 12px rgba(37,99,235,.1);background:#f9fbff}
.search-wrap .clr{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-light);font-size:18px;transition:color .2s;padding:4px}
.search-wrap .clr:hover{color:var(--text-dark)}
#result-count{text-align:center;font-size:12px;color:var(--text-light);margin-bottom:12px;min-height:16px;font-weight:500}

/* ── Search results ── */
#search-results{max-width:640px;margin:0 auto 20px;display:none;flex-direction:column;gap:6px;max-height:400px;overflow-y:auto;padding-right:4px}
.sr-item{background:#fff;border-radius:10px;padding:12px 16px;cursor:pointer;border:1.5px solid var(--border);display:flex;align-items:center;gap:12px;transition:all .2s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sr-item:hover{border-color:var(--gm-active);box-shadow:0 6px 16px rgba(37,99,235,.15);transform:translateX(4px)}
.sr-item.exact{border-color:var(--gm-active);background:#eff6ff;box-shadow:0 4px 12px rgba(37,99,235,.12)}
.sr-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:#fff}
.sr-avatar.gm{background:var(--gm-idle)}
.sr-avatar.rm{background:var(--gm-active)}
.sr-avatar.om{background:var(--om-active)}
.sr-avatar.sf{background:#64748b}
.sr-info{flex:1;min-width:0}
.sr-name{font-size:13px;font-weight:600;color:var(--text-dark)}
.sr-name mark{background:#fef08a;color:#78350f;border-radius:3px;padding:0 2px}
.sr-sub{font-size:11px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-badge{font-size:10px;font-weight:700;padding:3px 10px;border-radius:16px;flex-shrink:0;letter-spacing:.3px}
.sr-badge.gm{background:var(--gm-idle);color:#fff}
.sr-badge.rm{background:#dbeafe;color:var(--gm-active);font-weight:600}
.sr-badge.om{background:#d1fae5;color:var(--om-active);font-weight:600}
.sr-badge.sf{background:#f1f5f9;color:#64748b;font-weight:600}

/* ══════════════════════════════════════════
   GM CARDS — top row
══════════════════════════════════════════ */
.gm-row{
  display:flex;gap:20px;justify-content:center;flex-wrap:wrap;
  max-width:960px;margin:0 auto 0;
}

.gm-card{
  background:linear-gradient(135deg,var(--gm-idle) 0%,#2d4a7f 100%);
  color:#fff;
  border-radius:var(--radius-lg);
  padding:20px 22px 18px;
  min-width:240px;flex:1;max-width:300px;
  cursor:pointer;user-select:none;
  box-shadow:var(--shadow-md);
  position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
  transition:box-shadow .3s,background .3s,transform .35s cubic-bezier(.34,1.56,.64,1);
  will-change:transform;
  z-index:1;
}

/* Shimmer layer */
.gm-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);
  transform:translateX(-100%);
  transition:transform .6s ease;
  pointer-events:none;
}
.gm-card:hover::before{transform:translateX(100%)}

.gm-card:hover{
  box-shadow:var(--shadow-lift);
  transform:translateY(-4px) scale(1.02);
}

.gm-card.active{
  background:var(--gm-active);
  box-shadow:0 0 0 3px #93c5fd, var(--shadow-lift), 0 0 40px var(--gm-glow);
  transform:translateY(-8px) scale(1.04);
  z-index:10;
}

.gm-avatar{
  width:50px;height:50px;border-radius:50%;
  background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:800;margin-bottom:12px;
  transition:background .3s,transform .3s;
}
.gm-card.active .gm-avatar{background:rgba(255,255,255,.28);transform:scale(1.1)}

.gm-name{font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.3}
.gm-role{font-size:11px;opacity:.7;margin-top:4px;font-weight:500;letter-spacing:.2px}
.gm-stats{font-size:12px;opacity:.8;margin-top:10px;display:flex;gap:10px;font-weight:600}
.stat-pill{background:rgba(255,255,255,.15);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;transition:background .3s}
.gm-card.active .stat-pill{background:rgba(255,255,255,.22)}
.gm-phone{margin-top:8px}
.gm-phone a{font-size:11px;color:rgba(255,255,255,.75);text-decoration:none;transition:color .2s}
.gm-phone a:hover{color:#fff}
.gm-chevron{
  position:absolute;right:14px;top:14px;
  width:24px;height:24px;border-radius:50%;
  background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .3s;
}
.gm-card.active .gm-chevron{transform:rotate(90deg);background:rgba(255,255,255,.28)}

/* active indicator bar */
.gm-card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:rgba(255,255,255,.4);
  transform:scaleX(0);transform-origin:left;
  transition:transform .4s ease .1s;
}
.gm-card.active::after{transform:scaleX(1)}

/* ══════════════════════════════════════════
   EXPANDED GM AREA
══════════════════════════════════════════ */
.gm-expanded{
  position:relative;
  max-width:960px;margin:0 auto 24px;
}
.connector-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.conn{fill:none;stroke-linecap:round;stroke-width:2.5;transition:stroke-dashoffset .75s cubic-bezier(.42,.0,.58,1),stroke-width .3s ease,filter .3s ease}
.conn-dot{transition:opacity .35s ease,r .3s ease,filter .3s ease}
.gm-conn .conn{stroke:#93c5fd;filter:drop-shadow(0 0 4px rgba(147,197,253,.3))}
.gm-conn .conn-dot{fill:#93c5fd;filter:drop-shadow(0 0 6px rgba(147,197,253,.5))}
.gm-conn .conn:hover{filter:drop-shadow(0 0 8px rgba(147,197,253,.6))}
.om-conn .conn{stroke:#6ee7b7;filter:drop-shadow(0 0 4px rgba(110,231,183,.3))}
.om-conn .conn-dot{fill:#6ee7b7;filter:drop-shadow(0 0 6px rgba(110,231,183,.5))}
.om-conn .conn:hover{filter:drop-shadow(0 0 8px rgba(110,231,183,.6))}

/* ══════════════════════════════════════════
   RM CARDS
══════════════════════════════════════════ */
.rm-col{flex:1;min-width:190px;max-width:235px}
.om-col{flex:1;min-width:170px;max-width:210px}

.rm-row{
  display:flex;gap:14px;flex-wrap:wrap;padding:0;position:relative;z-index:1;
  justify-content:center;
  overflow-x:visible;overflow-y:hidden;max-height:0;opacity:0;transform:translateY(-12px);
  transition:max-height .45s cubic-bezier(.4,0,.2,1),opacity .3s ease,transform .35s ease,padding-top .45s cubic-bezier(.4,0,.2,1);
}
.gm-expanded.open .rm-row{max-height:6000px;opacity:1;transform:translateY(0);padding-top:40px}

.rm-card{
  background:#fff;
  border:2px solid var(--border);
  border-radius:var(--radius-md);
  padding:14px 16px;
  min-width:190px;flex:1;max-width:235px;
  cursor:pointer;user-select:none;
  box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
  transition:border .25s,box-shadow .25s,background .25s,transform .35s cubic-bezier(.34,1.56,.64,1);
  will-change:transform;
}
.rm-card:hover{
  border-color:#93c5fd;
  box-shadow:var(--shadow-md);
  transform:translateY(-3px) scale(1.02);
}
.rm-card.active{
  border-color:var(--rm-active);
  background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 100%);
  box-shadow:0 0 0 3px #bfdbfe, var(--shadow-md), 0 0 28px var(--rm-glow);
  transform:translateY(-5px) scale(1.03);
  color:#fff;
}
.rm-avatar{
  width:38px;height:38px;border-radius:50%;
  background:#dbeafe;color:var(--gm-active);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;margin-bottom:8px;
  transition:background .25s,color .25s,transform .3s;
}
.rm-card.active .rm-avatar{background:rgba(255,255,255,.25);color:#fff;transform:scale(1.1)}
.rm-name{font-size:13px;font-weight:600;color:var(--text-dark);transition:color .25s}
.rm-card.active .rm-name{color:#fff}
.rm-role{font-size:10.5px;color:var(--text-light);margin-top:2px;transition:color .25s}
.rm-card.active .rm-role{color:rgba(255,255,255,.7)}
.rm-stats{font-size:11px;color:var(--text-light);margin-top:6px;display:flex;gap:8px;transition:color .25s}
.rm-card.active .rm-stats{color:rgba(255,255,255,.75)}
.rm-spill{background:#f1f5f9;border-radius:20px;padding:2px 8px;font-size:10.5px;font-weight:600;transition:background .25s,color .25s}
.rm-card.active .rm-spill{background:rgba(255,255,255,.2);color:#fff}
.rm-phone a{font-size:10.5px;color:var(--gm-active);text-decoration:none;transition:color .25s}
.rm-card.active .rm-phone a{color:rgba(255,255,255,.8)}
.rm-chevron{
  position:absolute;right:12px;top:12px;
  width:22px;height:22px;border-radius:50%;
  background:#f1f5f9;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s;
  color:var(--text-light);
}
.rm-card.active .rm-chevron{transform:rotate(90deg);background:rgba(255,255,255,.25);color:#fff}

/* ══════════════════════════════════════════
   OM AREA + CARDS
══════════════════════════════════════════ */
.om-area{
  position:relative;
  margin-left:0;border-left:none;padding-left:0;margin-top:0;
}

.om-row{
  display:flex;gap:11px;flex-wrap:wrap;padding:0;position:relative;z-index:1;
  justify-content:center;
  overflow-x:visible;overflow-y:hidden;max-height:0;opacity:0;transform:translateY(-8px);
  transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .28s ease,transform .3s ease,padding .4s cubic-bezier(.4,0,.2,1);
}
.om-area.open .om-row{max-height:4000px;opacity:1;transform:translateY(0);padding:36px 0 4px}

.om-card{
  background:#fff;
  border:2px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  min-width:170px;flex:1;max-width:210px;
  cursor:pointer;user-select:none;
  box-shadow:var(--shadow-sm);
  position:relative;
  transition:border .25s,box-shadow .25s,background .25s,transform .35s cubic-bezier(.34,1.56,.64,1);
  will-change:transform;
}
.om-card:hover{
  border-color:#6ee7b7;
  box-shadow:var(--shadow-md);
  transform:translateY(-3px) scale(1.025);
}
.om-card.active{
  border-color:var(--om-active);
  background:linear-gradient(135deg,#047857 0%,#059669 100%);
  box-shadow:0 0 0 3px #a7f3d0, var(--shadow-md), 0 0 24px var(--om-glow);
  transform:translateY(-4px) scale(1.03);
  color:#fff;
}
.om-avatar{
  width:32px;height:32px;border-radius:50%;
  background:#d1fae5;color:var(--om-active);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;margin-bottom:6px;
  transition:background .25s,color .25s,transform .3s;
}
.om-card.active .om-avatar{background:rgba(255,255,255,.25);color:#fff;transform:scale(1.1)}
.om-name{font-size:12px;font-weight:600;color:var(--text-dark);transition:color .25s}
.om-card.active .om-name{color:#fff}
.om-role{font-size:10px;color:var(--text-light);margin-top:1px;transition:color .25s}
.om-card.active .om-role{color:rgba(255,255,255,.7)}
.om-stats{font-size:10.5px;color:var(--text-light);margin-top:5px;transition:color .25s}
.om-card.active .om-stats{color:rgba(255,255,255,.75)}
.om-phone a{font-size:10px;color:var(--om-active);text-decoration:none;transition:color .25s}
.om-card.active .om-phone a{color:rgba(255,255,255,.8)}
.om-chevron{
  position:absolute;right:10px;top:10px;
  width:20px;height:20px;border-radius:50%;
  background:#f1f5f9;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--text-light);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s,color .25s;
}
.om-card.active .om-chevron{transform:rotate(90deg);background:rgba(255,255,255,.25);color:#fff}

/* ══════════════════════════════════════════
   SF AREA
══════════════════════════════════════════ */
.sf-area{
  overflow-x:visible;overflow-y:hidden;
  max-height:0;opacity:0;transform:translateY(-6px);
  transition:max-height .38s cubic-bezier(.4,0,.2,1),opacity .25s ease,transform .28s ease,margin-top .38s ease;
  margin-left:0;border-left:none;padding-left:0;margin-top:0;
}
.sf-area.open{max-height:3000px;opacity:1;transform:translateY(0);margin-top:2px}

.sf-grid{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 8px;justify-content:center}
.sf-chip{
  background:#f8fafc;border:1.5px solid #e2e8f0;
  border-radius:18px;padding:6px 13px;
  font-size:12px;color:var(--text-mid);font-weight:500;
  display:flex;align-items:center;gap:6px;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.sf-chip:hover{background:#eff6ff;border-color:#93c5fd;transform:translateY(-2px);box-shadow:0 4px 8px rgba(37,99,235,.1)}
.sf-chip.highlight{background:#fef3c7;border-color:#f59e0b;font-weight:600;color:#92400e;box-shadow:0 4px 12px rgba(245,158,11,.2);transform:scale(1.08)}
.sf-loc{color:var(--text-light);font-size:11px;font-weight:400}

/* stagger SF chips on open */
.sf-area.open .sf-chip{animation:chipPop .25s ease both}
@keyframes chipPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

/* header-match glow */
.header-match{outline:3px solid #fbbf24 !important;outline-offset:2px}

/* Connector dot pulse */
@keyframes dotPulse{0%{r:4;opacity:1}50%{r:5.5;opacity:.7}100%{r:4;opacity:1}}
.conn-dot{animation:dotPulse 2s ease-in-out 1.2s infinite}

/* ══════════════════════════════════════════
   FOOTER
══════════════════════════════════════════ */
.footer{text-align:center;margin-top:60px;padding:24px 20px 40px;border-top:1px solid var(--border);background:linear-gradient(180deg,transparent 0%,rgba(37,99,235,.02) 100%)}
.footer-content{max-width:640px;margin:0 auto;font-size:12px;color:var(--text-light)}
.footer-content p{margin:0;line-height:1.5}
.footer-content strong{color:var(--text-mid);font-weight:600}

/* Connector lines are a desktop/dashboard affordance only — never render on touch devices */
@media (pointer:coarse){
  .connector-svg{display:none !important}
}

/* ── Mobile layout ── */
@media (max-width:600px){
  body{padding:16px 12px 60px}

  .page-header h1{font-size:22px}
  .page-header p{font-size:12px}

  .search-wrap{margin-bottom:12px}
  .search-wrap input{padding:12px 40px 12px 14px;font-size:13px}

  /* GM cards: full width, stack vertically */
  .gm-row{gap:12px}
  .gm-card{min-width:0;max-width:100%;width:100%;flex:1 1 100%;padding:16px 16px 14px}
  .gm-name{font-size:14px}
  .gm-stats{font-size:11px}
  .stat-pill{font-size:10px;padding:2px 7px}
  /* Disable lift transforms on touch */
  .gm-card:hover{transform:none}
  .gm-card.active{transform:none}

  /* RM cards: full width */
  .rm-row{gap:10px}
  .rm-col{min-width:0;max-width:100%;flex:1 1 100%}
  .rm-card{min-width:0;max-width:100%;width:100%;flex:1 1 100%}
  .rm-card:hover{transform:none}
  .rm-card.active{transform:none}

  /* OM cards: full width */
  .om-row{gap:8px}
  .om-col{min-width:0;max-width:100%;flex:1 1 100%}
  .om-card{min-width:0;max-width:100%;width:100%;flex:1 1 100%}
  .om-card:hover{transform:none}
  .om-card.active{transform:none}

  /* SF chips: two per row */
  .sf-grid{gap:6px}
  .sf-chip{flex:1 1 calc(50% - 6px);min-width:0;font-size:11px;padding:5px 10px}

  /* Expanded area: no horizontal padding */
  .gm-expanded{margin-bottom:16px}
  .gm-expanded.open .rm-row{padding-top:24px}
  .om-area.open .om-row{padding:24px 0 4px}
}
</style>
</head>
<body>

<div class="page-header">
  <h1>🏢 Jeeves Directory</h1>
  <p>Organizational hierarchy • Click cards to expand • Search by name, city, or state</p>
  <p style="font-size:11px;color:var(--text-light);margin-top:8px">GM → RM → OM → SF</p>
</div>

<div class="search-wrap">
  <input id="search" type="text" placeholder="Search GM, RM, OM, SF, city, state…" oninput="doSearch(this.value)" autocomplete="off">
  <button class="clr" onclick="clearSearch()">✕</button>
</div>
<div id="result-count"></div>
<div id="search-results"></div>
<div id="app"></div>

<div class="footer">
  <div class="footer-content">
    <p>📊 <strong>Jeeves Directory v1.2</strong> • Last updated: Sept 2026</p>
    <p style="font-size:11px;margin-top:4px">✨ Click any card to expand • 🔍 Search across names, cities, states • 📱 Click mobile numbers on phone to call</p>
  </div>
</div>

<script>
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function abbr(n){return(n||'').split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()}
function isMobileDevice(){return /Android|iPhone|iPad|iPod|Mobile|webOS/i.test(navigator.userAgent)||(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)}
function ph(m){if(!m)return'';return isMobileDevice()?`<a href="tel:${m}" onclick="event.stopPropagation()">${m}</a>`:`<span>${m}</span>`}

function sc(item,q){
  const n=item.nl,nc=n.replace(/\s+/g,''),qc=q.replace(/\s+/g,'');
  if(n===q||nc===qc)return 100;
  if(n.startsWith(q)||nc.startsWith(qc))return 90;
  if(n.split(' ').some(w=>w.startsWith(q)))return 82;
  if(n.includes(q)||nc.includes(qc))return 70;
  if((item.city||'').includes(q))return 60;
  if((item.state||'').includes(q))return 50;
  return 0;
}
function hl(text,q){
  if(!q)return esc(text);
  const re=new RegExp('('+q.replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&').split('').join('\\s*')+')','gi');
  return esc(text).replace(re,'<mark>$1</mark>');
}

/* ── Build DOM ── */
function build(){
  const app=document.getElementById('app');
  const gmRow=document.createElement('div');
  gmRow.className='gm-row';

  DATA.forEach((gm,gi)=>{
    const visRMs=CURRENT_STATUS==='ALL'?gm.rms:gm.rms.filter(r=>!r.status||r.status===CURRENT_STATUS);
    const totalOMs=visRMs.reduce((s,r)=>{
      const visOMs=CURRENT_STATUS==='ALL'?r.oms:r.oms.filter(o=>!o.status||o.status===CURRENT_STATUS);
      return s+visOMs.length;
    },0);
    const totalSFs=visRMs.reduce((s,r)=>{
      const visOMs=CURRENT_STATUS==='ALL'?r.oms:r.oms.filter(o=>!o.status||o.status===CURRENT_STATUS);
      return s+visOMs.reduce((ss,o)=>{
        const visSFs=CURRENT_STATUS==='ALL'?o.sfs:o.sfs.filter(sf=>!sf.status||sf.status===CURRENT_STATUS);
        return ss+visSFs.length;
      },0);
    },0);

    // GM card
    const card=document.createElement('div');
    card.className='gm-card';card.id='gm-c'+gi;
    card.innerHTML=`
      <div class="gm-chevron">›</div>
      <div class="gm-avatar">${esc(abbr(gm.name))}</div>
      <div class="gm-name">${esc(gm.name)}</div>
      <div class="gm-role">General Manager</div>
      <div class="gm-stats">
        <span class="stat-pill">${visRMs.length} RMs</span>
        <span class="stat-pill">${totalOMs} OMs</span>
        <span class="stat-pill">${totalSFs} SFs</span>
      </div>
      ${gm.mobile?`<div class="gm-phone">📞 ${ph(gm.mobile)}</div>`:''}
    `;
    card.addEventListener('click',()=>toggleGM(gi));
    gmRow.appendChild(card);

    // Expanded area
    const exp=document.createElement('div');
    exp.className='gm-expanded';exp.id='gm-e'+gi;

    const rmRow=document.createElement('div');
    rmRow.className='rm-row';

    gm.rms.forEach((rm,ri)=>{
      if(CURRENT_STATUS!=='ALL'&&rm.status&&rm.status!==CURRENT_STATUS)return;
      const visOMs=CURRENT_STATUS==='ALL'?rm.oms:rm.oms.filter(o=>!o.status||o.status===CURRENT_STATUS);
      const sfCount=visOMs.reduce((s,o)=>{
        const visSFs=CURRENT_STATUS==='ALL'?o.sfs:o.sfs.filter(sf=>!sf.status||sf.status===CURRENT_STATUS);
        return s+visSFs.length;
      },0);
      const rmCol=document.createElement('div');
      rmCol.className='rm-col';

      const rcard=document.createElement('div');
      rcard.className='rm-card';rcard.id=`rm-c${gi}-${ri}`;
      rcard.innerHTML=`
        <div class="rm-chevron">›</div>
        <div class="rm-avatar">${esc(abbr(rm.name))}</div>
        <div class="rm-name">${esc(rm.name)}</div>
        <div class="rm-role">Regional Manager</div>
        <div class="rm-stats">
          <span class="rm-spill">${visOMs.length} OMs</span>
          <span class="rm-spill">${sfCount} SFs</span>
        </div>
        ${rm.mobile?`<div class="rm-phone">📞 ${ph(rm.mobile)}</div>`:''}
      `;
      rcard.addEventListener('click',()=>toggleRM(gi,ri));
      rmCol.appendChild(rcard);
      rmRow.appendChild(rmCol);
    });

    exp.appendChild(rmRow);

    // OM areas (one per RM, full-width below RM row)
    gm.rms.forEach((rm,ri)=>{
      const omArea=document.createElement('div');
      omArea.className='om-area';omArea.id=`om-a${gi}-${ri}`;

      const omRow=document.createElement('div');
      omRow.className='om-row';

      rm.oms.forEach((om,oi)=>{
        if(CURRENT_STATUS!=='ALL'&&om.status&&om.status!==CURRENT_STATUS)return;
        const omCol=document.createElement('div');
        omCol.className='om-col';

        const ocard=document.createElement('div');
        ocard.className='om-card';ocard.id=`om-c${gi}-${ri}-${oi}`;
        ocard.innerHTML=`
          <div class="om-chevron">›</div>
          <div class="om-avatar">${esc(abbr(om.name))}</div>
          <div class="om-name">${esc(om.name)}</div>
          <div class="om-role">Operations Manager</div>
          <div class="om-stats">${(CURRENT_STATUS==='ALL'?om.sfs:om.sfs.filter(sf=>!sf.status||sf.status===CURRENT_STATUS)).length} SFs</div>
          ${om.mobile?`<div class="om-phone">📞 ${ph(om.mobile)}</div>`:''}
        `;
        ocard.addEventListener('click',()=>toggleOM(gi,ri,oi));
        omCol.appendChild(ocard);
        omRow.appendChild(omCol);
      });

      omArea.appendChild(omRow);

      // SF areas
      rm.oms.forEach((om,oi)=>{
        const sfArea=document.createElement('div');
        sfArea.className='sf-area';sfArea.id=`sf-a${gi}-${ri}-${oi}`;
        const grid=document.createElement('div');
        grid.className='sf-grid';
        om.sfs.forEach((sf,si)=>{
          if(CURRENT_STATUS!=='ALL'&&sf.status&&sf.status!==CURRENT_STATUS)return;
          const chip=document.createElement('div');
          chip.className='sf-chip';
          chip.dataset.nl=sf.name.toLowerCase();
          chip.dataset.city=(sf.city||'').toLowerCase();
          chip.dataset.state=(sf.state||'').toLowerCase();
          chip.style.animationDelay=(si*18)+'ms';
          chip.innerHTML=`🏪 <span>${esc(sf.name)}</span><span class="sf-loc">${esc(sf.city)}${sf.city&&sf.state?', ':''}${esc(sf.state)}</span>`;
          grid.appendChild(chip);
        });
        sfArea.appendChild(grid);
        omArea.appendChild(sfArea);
      });

      exp.appendChild(omArea);
    });

    app.appendChild(exp);
  });

  app.insertBefore(gmRow,app.firstChild);
}

/* ── Shared overlay SVG — single coordinate space for all connectors ── */
let _overlaySvg=null;
function getOverlay(){
  if(_overlaySvg)return _overlaySvg;
  const app=document.getElementById('app');
  app.style.position='relative';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:100';
  app.appendChild(svg);
  _overlaySvg=svg;
  return svg;
}

/* ── Connector lines ── */
// key → array of SVG elements drawn for that connector
const _connGroups={};

function drawConnectors(key,parentCard,childEls,strokeClass){
  if(!parentCard||!childEls.length)return;
  const svg=getOverlay();
  (_connGroups[key]||[]).forEach(el=>el.parentNode&&el.parentNode.removeChild(el));
  _connGroups[key]=[];

  // Use page coordinates (viewport + scroll) so the SVG absolute-position offsets
  // within #app stay correct regardless of scroll position.
  const sx=window.scrollX||window.pageXOffset;
  const sy=window.scrollY||window.pageYOffset;
  const app=document.getElementById('app');
  const aR=app.getBoundingClientRect();
  const aLeft=aR.left+sx, aTop=aR.top+sy;

  function pageX(r){return r.left+sx;}
  function pageY(r){return r.top+sy;}

  const pR=parentCard.getBoundingClientRect();
  const originX=pageX(pR)+pR.width/2-aLeft;
  const originY=pageY(pR)+pR.height-aTop;  // bottom of parent card

  const rows=[];
  childEls.forEach(el=>{
    const r=el.getBoundingClientRect();
    const top=Math.round(pageY(r)-aTop);
    const cx=pageX(r)+r.width/2-aLeft;
    let row=rows.find(row=>Math.abs(row.top-top)<6);
    if(!row){row={top,items:[]};rows.push(row);}
    row.items.push(cx);
  });
  rows.sort((a,b)=>a.top-b.top);

  const segs=[];
  let fromX=originX,fromY=originY;
  rows.forEach((row,ri)=>{
    const barY=row.top-10;
    const minX=Math.min(...row.items),maxX=Math.max(...row.items);
    segs.push({d:`M${fromX},${fromY} L${fromX},${barY}`,delay:ri*130});
    if(row.items.length>1)segs.push({d:`M${minX},${barY} L${maxX},${barY}`,delay:ri*130+130});
    row.items.forEach(cx=>segs.push({d:`M${cx},${barY} L${cx},${row.top}`,delay:ri*130+230}));
    fromX=(minX+maxX)/2;fromY=row.top;
  });

  const sc=strokeClass||'gm-conn';
  segs.forEach(s=>{
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',s.d);path.setAttribute('class','conn');
    path.classList.add(sc.replace('-conn',''));
    // apply stroke colour via inline so we don't need the nested .gm-conn .conn selector
    const stroke=sc==='gm-conn'?'#93c5fd':'#6ee7b7';
    path.style.stroke=stroke;
    svg.appendChild(path);
    _connGroups[key].push(path);
    const len=path.getTotalLength();
    path.style.strokeDasharray=len;path.style.strokeDashoffset=len;
    path.style.transitionDelay=s.delay+'ms';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{path.style.strokeDashoffset=0;}));
  });

  const dots=[{x:originX,y:originY,delay:0}];
  rows.forEach((row,ri)=>{row.items.forEach(cx=>dots.push({x:cx,y:row.top,delay:ri*130+280}));});
  dots.forEach((dot,di)=>{
    const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',dot.x);circle.setAttribute('cy',dot.y);circle.setAttribute('r',4);
    circle.setAttribute('class','conn-dot');
    circle.style.fill=sc==='gm-conn'?'#93c5fd':'#6ee7b7';
    circle.style.opacity='0';
    circle.style.transitionDelay=(dot.delay+di*35)+'ms';
    svg.appendChild(circle);
    _connGroups[key].push(circle);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{circle.style.opacity='1';}));
  });
}

function clearConnector(key){
  (_connGroups[key]||[]).forEach(el=>el.parentNode&&el.parentNode.removeChild(el));
  delete _connGroups[key];
}
function clearAllConnectors(){
  Object.keys(_connGroups).forEach(clearConnector);
}

const OPEN_CONNECTORS=[];
function scheduleDraw(key,parentCard,childEls,strokeClass){
  const idx=OPEN_CONNECTORS.findIndex(o=>o.key===key);
  const entry={key,parentCard,childEls,strokeClass};
  if(idx>-1)OPEN_CONNECTORS[idx]=entry;else OPEN_CONNECTORS.push(entry);
  setTimeout(()=>drawConnectors(key,parentCard,childEls,strokeClass),460);
  setTimeout(()=>drawConnectors(key,parentCard,childEls,strokeClass),700);
}
function unregisterConnector(key){
  const idx=OPEN_CONNECTORS.findIndex(o=>o.key===key);
  if(idx>-1)OPEN_CONNECTORS.splice(idx,1);
  clearConnector(key);
}
window.addEventListener('resize',()=>{OPEN_CONNECTORS.forEach(o=>drawConnectors(o.key,o.parentCard,o.childEls,o.strokeClass));});

/* ── Toggles ── */
function toggleGM(gi){
  const exp=document.getElementById('gm-e'+gi);
  const card=document.getElementById('gm-c'+gi);
  const isOpen=exp.classList.contains('open');
  document.querySelectorAll('.gm-expanded').forEach(e=>e.classList.remove('open'));
  document.querySelectorAll('.gm-card').forEach(c=>c.classList.remove('active'));
  // Also close RMs/OMs underneath
  document.querySelectorAll('.om-area,.sf-area').forEach(e=>e.classList.remove('open'));
  document.querySelectorAll('.rm-card,.om-card').forEach(c=>c.classList.remove('active'));
  clearAllConnectors();OPEN_CONNECTORS.length=0;
  if(!isOpen){
    exp.classList.add('open');card.classList.add('active');
    const rmCards=[...exp.querySelector('.rm-row').querySelectorAll(':scope > .rm-col > .rm-card')];
    if(!isMobileDevice())requestAnimationFrame(()=>scheduleDraw('gm-'+gi,card,rmCards,'gm-conn'));
  }
}

function toggleRM(gi,ri){
  event.stopPropagation();
  const area=document.getElementById(`om-a${gi}-${ri}`);
  const card=document.getElementById(`rm-c${gi}-${ri}`);
  const isOpen=area.classList.contains('open');
  // Close all OM areas + SF areas under this GM, deactivate all RM cards under this GM
  DATA[gi].rms.forEach((_,i)=>{
    const a=document.getElementById(`om-a${gi}-${i}`);
    const c=document.getElementById(`rm-c${gi}-${i}`);
    if(a)a.classList.remove('open');
    if(c)c.classList.remove('active');
    unregisterConnector(`om-${gi}-${i}`);
    DATA[gi].rms[i].oms.forEach((_2,j)=>{
      const sa=document.getElementById(`sf-a${gi}-${i}-${j}`);
      const oc=document.getElementById(`om-c${gi}-${i}-${j}`);
      if(sa)sa.classList.remove('open');
      if(oc)oc.classList.remove('active');
    });
  });
  if(!isOpen){
    area.classList.add('open');card.classList.add('active');
    const omCards=[...area.querySelector('.om-row').querySelectorAll(':scope > .om-col > .om-card')];
    if(!isMobileDevice())requestAnimationFrame(()=>scheduleDraw(`om-${gi}-${ri}`,card,omCards,'om-conn'));
  }
}

function toggleOM(gi,ri,oi){
  event.stopPropagation();
  const area=document.getElementById(`sf-a${gi}-${ri}-${oi}`);
  const card=document.getElementById(`om-c${gi}-${ri}-${oi}`);
  const isOpen=area.classList.contains('open');
  DATA[gi].rms[ri].oms.forEach((_,i)=>{
    const a=document.getElementById(`sf-a${gi}-${ri}-${i}`);
    const c=document.getElementById(`om-c${gi}-${ri}-${i}`);
    if(a)a.classList.remove('open');
    if(c)c.classList.remove('active');
  });
  if(!isOpen){area.classList.add('open');card.classList.add('active');}
}

/* ── Search ── */
let CURRENT_Q='';
function doSearch(raw){
  const rawTrim=raw.trim();
  const q=rawTrim.toLowerCase();
  CURRENT_Q=q;
  const panel=document.getElementById('search-results');
  const countEl=document.getElementById('result-count');
  if(!q){panel.style.display='none';panel.innerHTML='';countEl.textContent='';clearHL();return;}
  const matches=[];
  IDX.forEach(item=>{const s=sc(item,q);if(s>0)matches.push({...item,_s:s});});

  // Direct gm/rm/om name matches keep their forward-flow behavior.
  const direct=matches.filter(m=>m.type!=='sf');
  const directOmKeys=new Set(direct.filter(m=>m.type==='om').map(m=>m.gi+'-'+m.ri+'-'+m.oi));

  // Reverse flow: SF name / city / state matches get grouped up to their OM,
  // so searching "mumbai" surfaces the OMs covering Mumbai, not 100 store rows.
  const sfMatches=matches.filter(m=>m.type==='sf');
  const omAgg=new Map();
  sfMatches.forEach(sf=>{
    const key=sf.gi+'-'+sf.ri+'-'+sf.oi;
    if(directOmKeys.has(key))return; // already shown as a direct OM match
    if(!omAgg.has(key)){
      omAgg.set(key,{
        type:'om',name:sf.omName,nl:(sf.omName||'').toLowerCase(),mobile:sf.omMobile||'',
        path:sf.path.split(' › ').slice(0,2).join(' › '),
        gi:sf.gi,ri:sf.ri,oi:sf.oi,_s:sf._s,matchCount:0,
        sampleCity:sf.cityR,sampleState:sf.stateR
      });
    }
    const entry=omAgg.get(key);
    entry.matchCount++;
    if(sf._s>entry._s)entry._s=sf._s;
  });

  const combined=direct.concat(Array.from(omAgg.values()));
  combined.sort((a,b)=>b._s-a._s||a.name.localeCompare(b.name));

  const seen=new Set();
  const deduped=combined.filter(m=>{
    const k=m.type==='gm'?`gm:${m.gi}`:m.type==='rm'?`rm:${m.gi}-${m.ri}`:m.type==='om'?`om:${m.gi}-${m.ri}-${m.oi}`:`${m.type}:${m.name}`;
    if(seen.has(k))return false;seen.add(k);return true;
  });
  const top=deduped.slice(0,20);
  countEl.textContent=deduped.length?`${deduped.length} result${deduped.length>1?'s':''} found`:'No results.';
  if(!top.length){panel.style.display='none';clearHL();return;}
  panel.innerHTML='';panel.style.display='flex';
  top.forEach(item=>{
    const div=document.createElement('div');
    div.className='sr-item'+(item._s>=90?' exact':'');
    const loc=item.type==='sf'?`📍 ${esc(item.cityR)}${item.cityR&&item.stateR?', ':''}${esc(item.stateR)}`:'';
    const mob=item.mobile?`📞 ${esc(item.mobile)}`:'';
    const countLabel=item.matchCount?`🏪 ${item.matchCount} store${item.matchCount>1?'s':''} match "${esc(rawTrim)}"`:'';
    div.innerHTML=`
      <div class="sr-avatar ${item.type}">${esc(abbr(item.name))}</div>
      <div class="sr-info">
        <div class="sr-name">${hl(item.name,q)}</div>
        <div class="sr-sub">${[item.path,loc,mob,countLabel].filter(Boolean).join(' · ')}</div>
      </div>
      <span class="sr-badge ${item.type}">${item.type.toUpperCase()}</span>
    `;
    div.addEventListener('click',()=>reveal(item));
    panel.appendChild(div);
  });
  if(deduped.length>20){
    const m=document.createElement('div');
    m.style.cssText='text-align:center;font-size:12px;color:#9ca3af;padding:6px';
    m.textContent=`…and ${deduped.length-20} more — type more to narrow down`;
    panel.appendChild(m);
  }
}

function reveal(item){
  clearHL();
  // Open GM
  document.querySelectorAll('.gm-expanded').forEach(e=>e.classList.remove('open'));
  document.querySelectorAll('.gm-card').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.om-area,.sf-area').forEach(e=>e.classList.remove('open'));
  document.querySelectorAll('.rm-card,.om-card').forEach(c=>c.classList.remove('active'));
  const ge=document.getElementById('gm-e'+item.gi);
  const gc=document.getElementById('gm-c'+item.gi);
  ge.classList.add('open');gc.classList.add('active');
  if(item.type==='gm'){gc.classList.add('header-match');setTimeout(()=>gc.scrollIntoView({behavior:'smooth',block:'center'}),80);return;}
  // Open RM
  const ra=document.getElementById(`om-a${item.gi}-${item.ri}`);
  const rc=document.getElementById(`rm-c${item.gi}-${item.ri}`);
  if(ra){ra.classList.add('open');rc.classList.add('active');}
  if(item.type==='rm'){rc.classList.add('header-match');setTimeout(()=>rc.scrollIntoView({behavior:'smooth',block:'center'}),120);return;}
  // Open OM
  const sa=document.getElementById(`sf-a${item.gi}-${item.ri}-${item.oi}`);
  const oc=document.getElementById(`om-c${item.gi}-${item.ri}-${item.oi}`);
  if(sa){sa.classList.add('open');oc.classList.add('active');}
  if(item.type==='om'){
    oc.classList.add('header-match');
    // Reverse flow: if this OM was surfaced via a city/state/store-name search,
    // highlight every matching store chip inside it, not just the header.
    if(sa && CURRENT_Q){
      sa.querySelectorAll('.sf-chip').forEach(chip=>{
        const nl=chip.dataset.nl||'',city=chip.dataset.city||'',state=chip.dataset.state||'';
        if(nl.includes(CURRENT_Q)||city.includes(CURRENT_Q)||state.includes(CURRENT_Q))chip.classList.add('highlight');
      });
    }
    const firstHL=sa&&sa.querySelector('.sf-chip.highlight');
    setTimeout(()=>(firstHL||oc).scrollIntoView({behavior:'smooth',block:'center'}),150);
    return;
  }
  // Highlight SF
  if(sa){
    sa.querySelectorAll('.sf-chip').forEach(chip=>{if(chip.dataset.nl===item.nl)chip.classList.add('highlight');});
    const first=sa.querySelector('.sf-chip.highlight');
    if(first)setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'center'}),200);
  }
}

function clearHL(){
  document.querySelectorAll('.sf-chip.highlight').forEach(c=>c.classList.remove('highlight'));
  document.querySelectorAll('.header-match').forEach(h=>h.classList.remove('header-match'));
}
